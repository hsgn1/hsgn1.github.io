<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东营元锡工贸有限公司 - 颜料、助剂专业研发生产</title>
    <meta name="keywords" content="东营元锡工贸,颜料,颜料助剂,颜料研发,助剂生产">
    <meta name="description" content="东营元锡工贸有限公司专注于颜料、颜料助剂的研发、生产与销售，品质可靠，服务全国客户。">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", Arial, sans-serif;
        }
        body {
            color: #333;
            line-height: 1.6;
            background-color: #f8f9fa;
        }
        /* 头部导航 */
        .header {
            background: #1a365d;
            color: #fff;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .nav-list {
            display: flex;
            list-style: none;
        }
        .nav-list li {
            margin-left: 40px;
        }
        .nav-list a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }
        .nav-list a:hover {
            color: #ffc107;
        }
        /* 轮播横幅 */
        .banner {
            height: 450px;
            background: linear-gradient(rgba(26, 54, 93, 0.7), rgba(26, 54, 93, 0.7)), url('https://img0.baidu.com/it/u=2878922323,2679629239&fm=253&fmt=auto&app=138&f=JPEG?w=1200&h=500') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 0 20px;
        }
        .banner h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }
        .banner p {
            font-size: 20px;
            max-width: 800px;
        }
        /* 通用容器 */
        .container {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }
        .title {
            text-align: center;
            font-size: 32px;
            color: #1a365d;
            margin-bottom: 50px;
            position: relative;
        }
        .title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: #ffc107;
            margin: 15px auto;
        }
        /* 公司简介 */
        .about {
            display: flex;
            gap: 50px;
            align-items: center;
        }
        .about-text {
            flex: 1;
            font-size: 16px;
            color: #555;
        }
        .about-text h3 {
            font-size: 22px;
            color: #1a365d;
            margin-bottom: 20px;
        }
        .about-img {
            flex: 1;
        }
        .about-img img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        /* 产品中心 */
        .product-wrap {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        .product-item {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }
        .product-item:hover {
            transform: translateY(-8px);
        }
        .product-img img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .product-info {
            padding: 20px;
            text-align: center;
        }
        .product-info h4 {
            font-size: 18px;
            color: #1a365d;
            margin-bottom: 10px;
        }
        .product-info p {
            color: #666;
            font-size: 14px;
        }
        /* 核心优势 */
        .advantage {
            background: #1a365d;
            padding: 80px 0;
            color: #fff;
        }
        .advantage .title {
            color: #fff;
        }
        .advantage-wrap {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            text-align: center;
        }
        .advantage-item h4 {
            font-size: 20px;
            margin: 20px 0 10px;
        }
        .advantage-item p {
            opacity: 0.8;
            font-size: 14px;
        }
        /* 联系我们 */
        .contact-wrap {
            display: flex;
            gap: 50px;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        .contact-left {
            flex: 1;
        }
        .contact-left h3 {
            font-size: 22px;
            color: #1a365d;
            margin-bottom: 25px;
        }
        .contact-list p {
            margin: 15px 0;
            font-size: 16px;
        }
        .contact-right {
            flex: 1;
        }
        /* 页脚 */
        .footer {
            background: #0f213b;
            color: #ccc;
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
        }
        .footer p {
            font-size: 14px;
        }
        /* 响应式适配 */
        @media (max-width: 992px) {
            .about, .contact-wrap {
                flex-direction: column;
            }
            .product-wrap {
                grid-template-columns: repeat(2, 1fr);
            }
            .advantage-wrap {
                grid-template-columns: repeat(2, 1fr);
            }
            .banner h1 {
                font-size: 32px;
            }
        }
        @media (max-width: 576px) {
            .nav-list li {
                margin-left: 15px;
            }
            .product-wrap {
                grid-template-columns: 1fr;
            }
            .banner {
                height: 320px;
            }
            .banner h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <header class="header">
        <div class="nav-container">
            <div class="logo">东营元锡工贸有限公司</div>
            <ul class="nav-list">
                <li><a href=" ">首页</a ></li>
                <li><a href="#about">关于我们</a ></li>
                <li><a href="#product">产品中心</a ></li>
                <li><a href="#advantage">核心优势</a ></li>
                <li><a href="#contact">联系我们</a ></li>
            </ul>
        </div>
    </header>

    <!-- 首页横幅 -->
    <section class="banner" id="home">
        <h1>专注颜料与助剂 研发生产一体化</h1>
        <p>东营元锡工贸有限公司
